<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>URL Preview</title>
	<link rel="stylesheet" href="/styles.css">
	<script src="/app.js" defer></script>
</head>
<body>
	<main class="container">
		<h1>URL Preview</h1>
		<p class="intro">Enter a public web address to see its page preview.</p>
		<form id="preview-form">
			<label for="url">URL</label>
			<div class="form-row">
				<input id="url" name="url" type="url" placeholder="https://example.com" required>
				<button type="submit">Preview</button>
			</div>
		</form>
		<p id="status" role="status" aria-live="polite"></p>
		<article id="preview" class="preview-card" hidden>
			<img id="preview-image" alt="" hidden>
			<div class="preview-content">
				<h2 id="preview-title"></h2>
				<p id="preview-description"></p>
				<a id="preview-url" target="_blank" rel="noopener noreferrer"></a>
			</div>
		</article>
	</main>
</body>
</html>
